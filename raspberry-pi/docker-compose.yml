version: "3.8"

services:
  todomigob-notifications:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todomigob-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_PATH=/app/data/todomigob.db
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USER=${SMTP_USER:-todomigob.notificaciones@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-lykc jsej osgf ezee}
      - SMTP_APP_NAME=todomigob
      - SENDER_NAME=TODOMIGOB Alertas Ciudadanas
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
